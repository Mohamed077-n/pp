<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultation | Mohamed Nagiub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- RESET & BASE ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #0d0f14;
      --bg-card: #151a21;
      --primary: #a78bfa;
      --secondary: #6c8cff;
      --text-main: #eaeef2;
      --text-muted: #b8c0cc;
    }
    body {
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
      transition: all 0.3s ease; overflow-x: hidden;
    }
    body.rtl { direction: rtl; text-align: right; }

    a { text-decoration: none; color: inherit; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 24px; width: 100%; }

    /* ----- MODERN HEADER / NAV ----- */
    header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      background: rgba(13, 15, 20, 0.7); backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.05); padding: 12px 0;
      transition: 0.3s ease;
    }
    .nav { display: flex; justify-content: space-between; align-items: center; }
    
    .nav-logo {
      height: 50px; width: 50px; object-fit: cover;
      border-radius: 50%; background-color: #fff; padding: 2px;
      box-shadow: 0 0 15px rgba(167, 139, 250, 0.2);
      transition: transform 0.3s ease;
    }
    .nav-logo:hover { transform: scale(1.05); }

    .nav-menu { display: flex; align-items: center; gap: 2.5rem; }
    .nav-links { display: flex; gap: 2rem; list-style: none; font-weight: 500; align-items: center; }
    .nav-links a { font-size: 1rem; transition: color 0.2s; position: relative; }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px;
      background: var(--primary); transition: width 0.3s;
    }
    .nav-links a:hover { color: var(--primary); }
    .nav-links a:hover::after { width: 100%; }
    
    .lang-btn {
      background: rgba(167, 139, 250, 0.1); border: 1px solid var(--primary); color: var(--primary);
      padding: 8px 20px; border-radius: 30px; cursor: pointer;
      font-weight: 600; font-size: 0.9rem; transition: 0.3s;
    }
    .lang-btn:hover { background: var(--primary); color: var(--bg-dark); }

    .menu-toggle {
      display: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer;
      background: var(--bg-card); padding: 10px 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .close-menu { display: none; }
    .menu-overlay { display: none; }
    
    @media (max-width: 900px) {
      .menu-toggle { display: block; }
      .nav-menu {
        position: fixed; top: 0; right: -100%;
        width: 80%; max-width: 320px; height: 100vh;
        background: rgba(21, 26, 33, 0.95); backdrop-filter: blur(20px);
        border-left: 1px solid rgba(255,255,255,0.05);
        flex-direction: column; justify-content: flex-start; align-items: flex-start;
        padding: 80px 20px 40px;
        transition: right 0.4s cubic-bezier(0.77,0.2,0.05,1.0);
        z-index: 1001; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      }
      body.rtl .nav-menu {
        right: auto; left: -100%; border-left: none; border-right: 1px solid rgba(255,255,255,0.05);
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      }
      .nav-menu.active { right: 0; }
      body.rtl .nav-menu.active { left: 0; }

      .nav-links { flex-direction: column; width: 100%; gap: 10px; align-items: stretch; }
      .nav-links li { width: 100%; }
      .nav-links a {
        font-size: 1.1rem; display: flex; align-items: center; gap: 12px;
        padding: 14px 20px; border-radius: 14px; background: rgba(255,255,255,0.02);
        transition: 0.3s;
      }
      .nav-links a i { width: 24px; text-align: center; color: var(--primary); font-size: 1.2rem; }
      .nav-links a:hover, .nav-links a.active-link { background: rgba(167, 139, 250, 0.15); color: var(--primary); }
      .nav-links a::after { display: none; }
      .lang-btn { margin-top: 20px; width: 100%; text-align: center; }

      .close-menu {
        display: flex; align-items: center; justify-content: center;
        position: absolute; top: 20px; right: 20px;
        width: 40px; height: 40px; border-radius: 50%;
        background: rgba(255,255,255,0.05); cursor: pointer; color: var(--text-main);
        transition: 0.3s;
      }
      body.rtl .close-menu { right: auto; left: 20px; }
      .close-menu:hover { background: rgba(255, 87, 87, 0.2); color: #ff5757; }

      .menu-overlay {
        display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7); z-index: 1000; opacity: 0; pointer-events: none;
        transition: opacity 0.4s ease;
      }
      .menu-overlay.active { opacity: 1; pointer-events: auto; }
    }

    /* ----- CONSULTATION SECTION ----- */
    .consultation { padding: 140px 0 80px; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
    .consult-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px; margin: 0 auto; }
    
    .consult-header { text-align: center; margin-bottom: 40px; }
    .consult-header h1 { font-size: 2.5rem; margin-bottom: 1rem; color: var(--primary); transition: 0.3s; font-weight: 700; }
    .consult-header p { color: var(--text-muted); font-size: 1.1rem; margin: 0 auto; transition: 0.3s; }

    .consult-form {
      background: var(--bg-card); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
      width: 100%; box-shadow: 0 15px 50px rgba(0,0,0,0.4);
    }
    
    .form-toggle {
      display: flex; background: rgba(0,0,0,0.3); border-radius: 14px;
      padding: 6px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05);
    }
    .toggle-btn {
      flex: 1; padding: 12px; background: transparent; border: none;
      color: var(--text-muted); font-weight: 600; font-size: 0.95rem;
      cursor: pointer; border-radius: 10px; transition: 0.3s; font-family: inherit;
    }
    .toggle-btn.active { background: var(--primary); color: var(--bg-dark); box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3); }

    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; margin-bottom: 10px; color: var(--text-main); font-weight: 600; font-size: 0.95rem; }
    .form-control {
      width: 100%; padding: 14px 18px; border-radius: 14px;
      background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.08); color: #fff;
      font-family: inherit; transition: 0.3s; font-size: 0.95rem;
    }
    .form-control:focus { outline: none; border-color: var(--primary); background: rgba(0,0,0,0.4); box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1); }
    
    select.form-control {
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a78bfa%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat; background-position: right 1.2rem center; background-size: 12px;
    }
    body.rtl select.form-control { background-position: left 1.2rem center; }
    select.form-control option { background: var(--bg-card); color: #fff; }

    #consultation-extra-fields { display: none; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px 32px; border-radius: 14px; font-weight: 700; font-size: 1.05rem;
      transition: all 0.3s; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--secondary), var(--primary)); color: #fff;
      box-shadow: 0 10px 30px rgba(108, 140, 255, 0.3);
      width: 100%;
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(108, 140, 255, 0.5); }

    footer { padding: 30px 0; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; color: #5a6475; font-size: 0.9rem; width: 100%; }

    @media (max-width: 600px) {
      .consult-header h1 { font-size: 2rem; }
      .consult-form { padding: 24px; }
      .consultation { padding-top: 120px; }
    }
  </style>
</head>
<body>

<!-- ====== HEADER ====== -->
<header>
  <div class="container nav">
    <a href="index.html">
      <img src="logo.png" alt="Mohamed Nagiub Logo" class="nav-logo">
    </a>

    <div class="menu-toggle" id="mobile-menu">
      <i class="fas fa-bars"></i>
    </div>

    <div class="nav-menu" id="nav-menu">
      <div class="close-menu" id="close-menu">
        <i class="fas fa-times"></i>
      </div>
      
      <ul class="nav-links">
        <li><a href="index.html"><i class="fas fa-home"></i> <span data-en="Home" data-ar="الرئيسية">Home</span></a></li>
        <li><a href="index.html#projects"><i class="fas fa-folder-open"></i> <span data-en="Projects" data-ar="المشاريع">Projects</span></a></li>
        <li><a href="consultation.html" class="active-link"><i class="fas fa-calendar-check"></i> <span data-en="Consultation" data-ar="الاستشارات">Consultation</span></a></li>
      </ul>
      
      <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">AR / EN</button>
    </div>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay"></div>

<!-- ====== CONSULTATION SECTION ====== -->
<section class="consultation">
  <div class="container consult-wrapper">
    
    <div class="consult-header">
      <h1 id="page-title">Book a Consultation</h1>
      <p id="page-subtitle">Whether you need to build a data-driven strategy...</p>
    </div>

    <form class="consult-form" onsubmit="sendToWhatsApp(event)">
      
      <div class="form-toggle">
        <button type="button" id="btn-inquiry" class="toggle-btn active" onclick="setFormMode('inquiry')">Inquiry / استفسار</button>
        <button type="button" id="btn-consultation" class="toggle-btn" onclick="setFormMode('consultation')">Consultation / استشارة</button>
      </div>

      <div class="form-group">
        <label for="cName" id="lbl-name">Your Name</label>
        <input type="text" id="cName" class="form-control" required>
      </div>

      <div id="consultation-extra-fields">
        <div class="form-group">
          <label for="cService" id="lbl-service">Service Needed</label>
          <select id="cService" class="form-control">
            <option value="Data Analysis" data-en="Data Analysis & BI" data-ar="تحليل البيانات وذكاء الأعمال">Data Analysis & BI</option>
            <option value="Social Media" data-en="Social Media Management" data-ar="إدارة السوشيال ميديا">Social Media Management</option>
            <option value="Paid Ads" data-en="Paid Advertising" data-ar="الإعلانات المدفوعة">Paid Advertising</option>
            <option value="Educational" data-en="Educational Solutions" data-ar="الحلول التعليمية">Educational Solutions</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cBusiness" id="lbl-business">Your Business / Industry</label>
          <input type="text" id="cBusiness" class="form-control" data-en-placeholder="e.g., E-commerce, Education, Tech..." data-ar-placeholder="مثال: تجارة إلكترونية، تعليم، تكنولوجيا...">
        </div>
      </div>

      <div class="form-group">
        <label for="cProject" id="lbl-details">Project Details</label>
        <textarea id="cProject" class="form-control" rows="4" required></textarea>
      </div>

      <button type="submit" class="btn-primary">
        <i class="fab fa-whatsapp"></i> <span id="btn-submit-text">Send</span>
      </button>
    </form>

  </div>
</section>

<!-- ====== FOOTER ====== -->
<footer>
  <div class="container">
    <span data-en="&copy; 2025 Mohamed Nagiub. Built with ❤️ for data." data-ar="&copy; 2025 محمد نجيب. صُنع بـ ❤️ للبيانات.">
      &copy; 2025 Mohamed Nagiub. Built with ❤️ for data.
    </span>
  </div>
</footer>

<!-- ====== SCRIPTS ====== -->
<script>
  let currentLang = 'en'; 
  let formMode = 'inquiry'; 

  if(localStorage.getItem('siteLang') === 'ar') {
    currentLang = 'ar';
    document.body.classList.add('rtl');
    document.documentElement.lang = 'ar';
  }

  function toggleLanguage() {
    currentLang = currentLang === 'en' ? 'ar' : 'en';
    localStorage.setItem('siteLang', currentLang);
    
    const toggleBtn = document.getElementById('langToggle');
    
    if (currentLang === 'ar') {
      document.body.classList.add('rtl');
      document.documentElement.lang = 'ar';
      toggleBtn.innerText = 'EN / AR';
    } else {
      document.body.classList.remove('rtl');
      document.documentElement.lang = 'en';
      toggleBtn.innerText = 'AR / EN';
    }

    document.querySelectorAll('[data-en]').forEach(el => {
      el.innerHTML = el.getAttribute('data-' + currentLang);
    });

    document.querySelectorAll('[data-en-placeholder]').forEach(el => {
      el.setAttribute('placeholder', el.getAttribute(`data-${currentLang}-placeholder`));
    });

    updateFormTexts();
  }

  function setFormMode(mode) {
    formMode = mode;
    
    document.getElementById('btn-inquiry').classList.toggle('active', mode === 'inquiry');
    document.getElementById('btn-consultation').classList.toggle('active', mode === 'consultation');
    
    const extraFields = document.getElementById('consultation-extra-fields');
    if (mode === 'consultation') {
      extraFields.style.display = 'block';
      document.getElementById('cBusiness').required = true; 
    } else {
      extraFields.style.display = 'none';
      document.getElementById('cBusiness').required = false;
      document.getElementById('cBusiness').value = ''; 
    }
    
    updateFormTexts();
  }

  function updateFormTexts() {
    const isEn = currentLang === 'en';
    
    const texts = {
      inquiry: {
        pageTitle: isEn ? 'Send an Inquiry' : 'إرسال استفسار',
        pageSubtitle: isEn ? 'Do you have a question? Send me your inquiry and I will get back to you as soon as possible.' : 'هل لديك سؤال؟ أرسل لي استفسارك وسأرد عليك في أقرب وقت ممكن.',
        btnInq: isEn ? 'Inquiry' : 'استفسار',
        btnCons: isEn ? 'Consultation' : 'استشارة',
        nameLabel: isEn ? 'Your Name' : 'اسمك',
        namePlaceholder: isEn ? 'Enter your name' : 'أدخل اسمك',
        detailsLabel: isEn ? 'Your Question / Inquiry' : 'سؤالك / موضوع الاستفسار',
        detailsPlaceholder: isEn ? 'What would you like to ask about?' : 'عن ماذا تريد أن تسأل؟',
        submitBtn: isEn ? 'Send Inquiry via WhatsApp' : 'إرسال الاستفسار عبر واتساب'
      },
      consultation: {
        pageTitle: isEn ? 'Book a Consultation' : 'احجز استشارة',
        pageSubtitle: isEn ? 'Whether you need to build a data-driven strategy, manage your social media presence, or analyze your business numbers... I am here to help you grow.' : 'سواء كنت بحاجة لبناء استراتيجية مبنية على البيانات، إدارة تواجدك على السوشيال ميديا، أو تحليل أرقام مشروعك... أنا هنا لمساعدتك على النمو.',
        btnInq: isEn ? 'Inquiry' : 'استفسار',
        btnCons: isEn ? 'Consultation' : 'استشارة',
        nameLabel: isEn ? 'Your Name' : 'اسمك',
        namePlaceholder: isEn ? 'Enter your name' : 'أدخل اسمك',
        detailsLabel: isEn ? 'Additional Project Details' : 'تفاصيل إضافية عن المشروع',
        detailsPlaceholder: isEn ? 'Tell me more about what you need...' : 'أخبرني المزيد عما تحتاجه...',
        submitBtn: isEn ? 'Book Consultation via WhatsApp' : 'احجز استشارة عبر واتساب'
      }
    };

    const t = texts[formMode];
    
    document.getElementById('page-title').innerText = t.pageTitle;
    document.getElementById('page-subtitle').innerText = t.pageSubtitle;
    document.getElementById('btn-inquiry').innerText = t.btnInq;
    document.getElementById('btn-consultation').innerText = t.btnCons;
    document.getElementById('lbl-name').innerText = t.nameLabel;
    document.getElementById('cName').setAttribute('placeholder', t.namePlaceholder);
    document.getElementById('lbl-details').innerText = t.detailsLabel;
    document.getElementById('cProject').setAttribute('placeholder', t.detailsPlaceholder);
    document.getElementById('btn-submit-text').innerText = t.submitBtn;

    document.getElementById('lbl-service').innerText = isEn ? 'Service Needed' : 'الخدمة المطلوبة';
    document.getElementById('lbl-business').innerText = isEn ? 'Your Business / Industry' : 'مجال عملك / شركتك';
  }

  function sendToWhatsApp(e) {
    e.preventDefault();
    const name = document.getElementById('cName').value;
    const project = document.getElementById('cProject').value;
    const phone = '201272137273'; 
    
    let msg = '';
    
    if (currentLang === 'en') {
      if (formMode === 'inquiry') {
        msg = `Hello Mohamed, my name is ${name}. I have an inquiry: ${project}`;
      } else {
        const service = document.getElementById('cService').value;
        const business = document.getElementById('cBusiness').value;
        msg = `Hello Mohamed, my name is ${name}.\nI would like to book a consultation.\nService Needed: ${service}\nMy Business: ${business}\nDetails: ${project}`;
      }
    } else {
      if (formMode === 'inquiry') {
        msg = `مرحباً محمد، اسمي ${name}. لدي استفسار بخصوص: ${project}`;
      } else {
        const serviceSelect = document.getElementById('cService');
        const serviceAr = serviceSelect.options[serviceSelect.selectedIndex].getAttribute('data-ar');
        const business = document.getElementById('cBusiness').value;
        msg = `مرحباً محمد، اسمي ${name}.\nأرغب في حجز استشارة.\nالخدمة المطلوبة: ${serviceAr}\nمجال عملي: ${business}\nتفاصيل إضافية: ${project}`;
      }
    }
      
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  // Sidebar Logic
  const mobileMenu = document.getElementById('mobile-menu');
  const navMenu = document.getElementById('nav-menu');
  const closeMenu = document.getElementById('close-menu');
  const menuOverlay = document.getElementById('menu-overlay');

  function toggleMenu() {
    navMenu.classList.toggle('active');
    menuOverlay.classList.toggle('active');
    document.body.style.overflow = navMenu.classList.contains('active') ? 'hidden' : 'auto';
  }

  mobileMenu.addEventListener('click', toggleMenu);
  closeMenu.addEventListener('click', toggleMenu);
  menuOverlay.addEventListener('click', toggleMenu);

  // Smooth nav scroll (FIXED)
  document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', function(e) {
      const href = this.getAttribute('href');
      
      if (href.startsWith('#') && href !== '#') {
        e.preventDefault();
        const target = document.querySelector(href);
        
        if (navMenu.classList.contains('active')) {
          toggleMenu();
        }
        
        setTimeout(() => {
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 400);
      } else {
        if (navMenu.classList.contains('active')) {
          toggleMenu();
        }
      }
    });
  });

  window.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('langToggle');
    if (currentLang === 'ar') {
      document.body.classList.add('rtl');
      document.documentElement.lang = 'ar';
      if(toggleBtn) toggleBtn.innerText = 'EN / AR';
      document.querySelectorAll('[data-en]').forEach(el => {
        el.innerHTML = el.getAttribute('data-ar');
      });
    } else {
      if(toggleBtn) toggleBtn.innerText = 'AR / EN';
    }
    updateFormTexts();
  });
</script>

</body>
</html>
