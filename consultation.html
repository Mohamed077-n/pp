<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultation | Mohamed Nagiub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- RESET & BASE ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0d0f14; color: #eaeef2;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
      transition: all 0.3s ease;
    }
    body.rtl { direction: rtl; text-align: right; }

    a { text-decoration: none; color: inherit; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 24px; width: 100%; }

    /* ----- HEADER / NAV ----- */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13, 15, 20, 0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.05); padding: 14px 0;
    }
    .nav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .nav-links { display: flex; gap: 2rem; list-style: none; font-weight: 500; align-items: center; margin: 0 auto; }
    .nav-links a { font-size: 1rem; transition: color 0.2s; }
    .nav-links a:hover { color: #a78bfa; }
    
    .lang-btn {
      background: #1e232b; border: 1px solid #a78bfa; color: #a78bfa;
      padding: 6px 16px; border-radius: 20px; cursor: pointer;
      font-weight: bold; font-size: 0.9rem; transition: 0.3s;
    }
    .lang-btn:hover { background: #a78bfa; color: #0d0f14; }

    /* ----- CONSULTATION SECTION ----- */
    .consultation { padding: 60px 0; flex-grow: 1; display: flex; align-items: center; }
    .consult-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; }
    
    .consult-header { text-align: center; margin-bottom: 40px; }
    .consult-header h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #a78bfa; transition: 0.3s; }
    .consult-header p { color: #b8c0cc; font-size: 1.1rem; max-width: 600px; margin: 0 auto; transition: 0.3s; }

    .consult-form {
      background: #151a21; padding: 40px; border-radius: 24px; border: 1px solid #252b34;
      width: 100%; max-width: 600px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    
    /* Form Toggle */
    .form-toggle {
      display: flex; background: #0d0f14; border-radius: 12px;
      padding: 6px; margin-bottom: 24px; border: 1px solid #2a2f3a;
    }
    .toggle-btn {
      flex: 1; padding: 10px; background: transparent; border: none;
      color: #8892a0; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; border-radius: 8px; transition: 0.3s;
      font-family: inherit;
    }
    .toggle-btn.active { background: #a78bfa; color: #0d0f14; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #c8d0dd; font-weight: 500; }
    .form-control {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      background: #0d0f14; border: 1px solid #2a2f3a; color: #fff;
      font-family: inherit; transition: 0.3s;
    }
    .form-control:focus { outline: none; border-color: #a78bfa; box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2); }
    
    /* Custom Select Styling */
    select.form-control {
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a78bfa%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat; background-position: right 1rem center; background-size: 12px;
    }
    body.rtl select.form-control { background-position: left 1rem center; }
    select.form-control option { background: #0d0f14; color: #fff; }

    /* Extra Fields Animation */
    #consultation-extra-fields { display: none; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .btn-primary {
      display: inline-block; padding: 12px 32px; border-radius: 40px;
      font-weight: 600; transition: all 0.3s; border: none; cursor: pointer;
      background: linear-gradient(135deg, #6c8cff, #a78bfa); color: #fff;
      box-shadow: 0 8px 24px rgba(108, 140, 255, 0.25);
      width: 100%; font-size: 1rem;
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(108, 140, 255, 0.4); }

    /* ----- FOOTER ----- */
    footer { padding: 24px 0; border-top: 1px solid #1e232b; text-align: center; color: #5a6475; font-size: 0.9rem; }

    @media (max-width: 600px) {
      .nav-links { gap: 1rem; font-size: 0.9rem; flex-wrap: wrap; justify-content: center; }
      .consult-header h1 { font-size: 2rem; }
      .consult-form { padding: 24px; }
    }
  </style>
</head>
<body>

<!-- ====== HEADER ====== -->
<header>
  <div class="container nav">
    <ul class="nav-links">
      <li><a href="index.html" data-en="Home" data-ar="الرئيسية">Home</a></li>
      <li><a href="index.html#projects" data-en="Projects" data-ar="المشاريع">Projects</a></li>
      <li><a href="consultation.html" style="color: #a78bfa;" data-en="Consultation" data-ar="الاستشارات">Consultation</a></li>
    </ul>
    <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">AR / EN</button>
  </div>
</header>

<!-- ====== CONSULTATION SECTION ====== -->
<section class="consultation">
  <div class="container consult-wrapper">
    
    <!-- تم إضافة ID هنا عشان الجافاسكريبت تغيره -->
    <div class="consult-header">
      <h1 id="page-title">Book a Consultation</h1>
      <p id="page-subtitle">Whether you need to build a data-driven strategy, manage your social media presence...</p>
    </div>

    <form class="consult-form" onsubmit="sendToWhatsApp(event)">
      
      <!-- Toggle Buttons -->
      <div class="form-toggle">
        <button type="button" id="btn-inquiry" class="toggle-btn active" onclick="setFormMode('inquiry')">Inquiry / استفسار</button>
        <button type="button" id="btn-consultation" class="toggle-btn" onclick="setFormMode('consultation')">Consultation / استشارة</button>
      </div>

      <div class="form-group">
        <label for="cName" id="lbl-name">Your Name</label>
        <input type="text" id="cName" class="form-control" required>
      </div>

      <!-- Extra Fields for Consultation Only (Hidden by default) -->
      <div id="consultation-extra-fields">
        <div class="form-group">
          <label for="cService" id="lbl-service">Service Needed</label>
          <select id="cService" class="form-control">
            <option value="Data Analysis" data-en="Data Analysis & BI" data-ar="تحليل البيانات وذكاء الأعمال">Data Analysis & BI</option>
            <option value="Social Media" data-en="Social Media Management" data-ar="إدارة السوشيال ميديا">Social Media Management</option>
            <option value="Paid Ads" data-en="Paid Advertising" data-ar="الإعلانات المدفوعة">Paid Advertising</option>
            <option value="Educational" data-en="Educational Solutions" data-ar="الحلول التعليمية">Educational Solutions</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cBusiness" id="lbl-business">Your Business / Industry</label>
          <input type="text" id="cBusiness" class="form-control" data-en-placeholder="e.g., E-commerce, Education, Tech..." data-ar-placeholder="مثال: تجارة إلكترونية، تعليم، تكنولوجيا...">
        </div>
      </div>

      <div class="form-group">
        <label for="cProject" id="lbl-details">Project Details</label>
        <textarea id="cProject" class="form-control" rows="4" required></textarea>
      </div>

      <button type="submit" class="btn-primary">
        <i class="fab fa-whatsapp"></i> <span id="btn-submit-text">Send</span>
      </button>
    </form>

  </div>
</section>

<!-- ====== FOOTER ====== -->
<footer>
  <div class="container">
    <span data-en="&copy; 2025 Mohamed Nagiub. Built with ❤️ for data." data-ar="&copy; 2025 محمد نجيب. صُنع بـ ❤️ للبيانات.">
      &copy; 2025 Mohamed Nagiub. Built with ❤️ for data.
    </span>
  </div>
</footer>

<!-- ====== SCRIPTS ====== -->
<script>
  let currentLang = 'en'; 
  let formMode = 'inquiry'; 

  // Load language preference
  if(localStorage.getItem('siteLang') === 'ar') {
    currentLang = 'ar';
    document.body.classList.add('rtl');
    document.documentElement.lang = 'ar';
  }

  function toggleLanguage() {
    currentLang = currentLang === 'en' ? 'ar' : 'en';
    localStorage.setItem('siteLang', currentLang);
    
    const toggleBtn = document.getElementById('langToggle');
    
    if (currentLang === 'ar') {
      document.body.classList.add('rtl');
      document.documentElement.lang = 'ar';
      toggleBtn.innerText = 'EN / AR';
    } else {
      document.body.classList.remove('rtl');
      document.documentElement.lang = 'en';
      toggleBtn.innerText = 'AR / EN';
    }

    document.querySelectorAll('[data-en]').forEach(el => {
      el.innerHTML = el.getAttribute('data-' + currentLang);
    });

    document.querySelectorAll('[data-en-placeholder]').forEach(el => {
      el.setAttribute('placeholder', el.getAttribute(`data-${currentLang}-placeholder`));
    });

    updateFormTexts();
  }

  function setFormMode(mode) {
    formMode = mode;
    
    document.getElementById('btn-inquiry').classList.toggle('active', mode === 'inquiry');
    document.getElementById('btn-consultation').classList.toggle('active', mode === 'consultation');
    
    const extraFields = document.getElementById('consultation-extra-fields');
    if (mode === 'consultation') {
      extraFields.style.display = 'block';
      document.getElementById('cBusiness').required = true; 
    } else {
      extraFields.style.display = 'none';
      document.getElementById('cBusiness').required = false;
      document.getElementById('cBusiness').value = ''; 
    }
    
    updateFormTexts();
  }

  function updateFormTexts() {
    const isEn = currentLang === 'en';
    
    // هنا بنغير الكلام بتاع العناوين الرئيسية حسب الزرار
    const texts = {
      inquiry: {
        pageTitle: isEn ? 'Send an Inquiry' : 'إرسال استفسار',
        pageSubtitle: isEn ? 'Do you have a question? Send me your inquiry and I will get back to you as soon as possible.' : 'هل لديك سؤال؟ أرسل لي استفسارك وسأرد عليك في أقرب وقت ممكن.',
        btnInq: isEn ? 'Inquiry' : 'استفسار',
        btnCons: isEn ? 'Consultation' : 'استشارة',
        nameLabel: isEn ? 'Your Name' : 'اسمك',
        namePlaceholder: isEn ? 'Enter your name' : 'أدخل اسمك',
        detailsLabel: isEn ? 'Your Question / Inquiry' : 'سؤالك / موضوع الاستفسار',
        detailsPlaceholder: isEn ? 'What would you like to ask about?' : 'عن ماذا تريد أن تسأل؟',
        submitBtn: isEn ? 'Send Inquiry via WhatsApp' : 'إرسال الاستفسار عبر واتساب'
      },
      consultation: {
        pageTitle: isEn ? 'Book a Consultation' : 'احجز استشارة',
        pageSubtitle: isEn ? 'Whether you need to build a data-driven strategy, manage your social media presence, or analyze your business numbers... I am here to help you grow.' : 'سواء كنت بحاجة لبناء استراتيجية مبنية على البيانات، إدارة تواجدك على السوشيال ميديا، أو تحليل أرقام مشروعك... أنا هنا لمساعدتك على النمو.',
        btnInq: isEn ? 'Inquiry' : 'استفسار',
        btnCons: isEn ? 'Consultation' : 'استشارة',
        nameLabel: isEn ? 'Your Name' : 'اسمك',
        namePlaceholder: isEn ? 'Enter your name' : 'أدخل اسمك',
        detailsLabel: isEn ? 'Additional Project Details' : 'تفاصيل إضافية عن المشروع',
        detailsPlaceholder: isEn ? 'Tell me more about what you need...' : 'أخبرني المزيد عما تحتاجه...',
        submitBtn: isEn ? 'Book Consultation via WhatsApp' : 'احجز استشارة عبر واتساب'
      }
    };

    const t = texts[formMode];
    
    // تغيير العنوان الرئيسي والوصف
    document.getElementById('page-title').innerText = t.pageTitle;
    document.getElementById('page-subtitle').innerText = t.pageSubtitle;

    // تغيير باقي النصوص
    document.getElementById('btn-inquiry').innerText = t.btnInq;
    document.getElementById('btn-consultation').innerText = t.btnCons;
    document.getElementById('lbl-name').innerText = t.nameLabel;
    document.getElementById('cName').setAttribute('placeholder', t.namePlaceholder);
    document.getElementById('lbl-details').innerText = t.detailsLabel;
    document.getElementById('cProject').setAttribute('placeholder', t.detailsPlaceholder);
    document.getElementById('btn-submit-text').innerText = t.submitBtn;

    document.getElementById('lbl-service').innerText = isEn ? 'Service Needed' : 'الخدمة المطلوبة';
    document.getElementById('lbl-business').innerText = isEn ? 'Your Business / Industry' : 'مجال عملك / شركتك';
  }

  function sendToWhatsApp(e) {
    e.preventDefault();
    const name = document.getElementById('cName').value;
    const project = document.getElementById('cProject').value;
    const phone = '201272137273'; 
    
    let msg = '';
    
    if (currentLang === 'en') {
      if (formMode === 'inquiry') {
        msg = `Hello Mohamed, my name is ${name}. I have an inquiry: ${project}`;
      } else {
        const service = document.getElementById('cService').value;
        const business = document.getElementById('cBusiness').value;
        msg = `Hello Mohamed, my name is ${name}.\nI would like to book a consultation.\nService Needed: ${service}\nMy Business: ${business}\nDetails: ${project}`;
      }
    } else {
      if (formMode === 'inquiry') {
        msg = `مرحباً محمد، اسمي ${name}. لدي استفسار بخصوص: ${project}`;
      } else {
        const serviceSelect = document.getElementById('cService');
        const serviceAr = serviceSelect.options[serviceSelect.selectedIndex].getAttribute('data-ar');
        const business = document.getElementById('cBusiness').value;
        msg = `مرحباً محمد، اسمي ${name}.\nأرغب في حجز استشارة.\nالخدمة المطلوبة: ${serviceAr}\nمجال عملي: ${business}\nتفاصيل إضافية: ${project}`;
      }
    }
      
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  // Initialize on load
  window.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('langToggle');
    if (currentLang === 'ar') {
      document.body.classList.add('rtl');
      document.documentElement.lang = 'ar';
      if(toggleBtn) toggleBtn.innerText = 'EN / AR';
      document.querySelectorAll('[data-en]').forEach(el => {
        el.innerHTML = el.getAttribute('data-ar');
      });
    } else {
      if(toggleBtn) toggleBtn.innerText = 'AR / EN';
    }
    updateFormTexts();
  });
</script>

</body>
</html>
